name: CI

# Every job here is intentionally informational, not a merge gate: each has
# its own job so one red check never hides another, and none of them is
# listed in the branch ruleset's required status checks. CodeQL (the
# organization's own enforced default code-scanning setup, not a workflow in
# this repo — see bootstrap.yml and README.md) is the only required check.
on:
  pull_request:

permissions:
  contents: read

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm audit

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run build -- --base=/${{ github.event.repository.name }}/

  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      # lint:ci is the non-fixing, non-cached variant. `npm run lint` (with
      # --fix) is for developers; running it here would silently repair the
      # runner's working copy and report green regardless of what was
      # actually committed.
      - run: npm run lint:ci

  test:
    name: Test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Check for a test script
        id: check
        run: |
          if node -e "process.exit(require('./package.json').scripts?.test ? 0 : 1)"; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
          fi
      - name: Run tests
        if: steps.check.outputs.has_tests == 'true'
        run: npm test
      - name: No tests configured
        if: steps.check.outputs.has_tests != 'true'
        run: echo "No \"test\" script in package.json — skipping cleanly."
